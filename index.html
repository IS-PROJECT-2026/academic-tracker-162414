<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Academic Tracking Dashboard</h1>

        <div class="form-box">
            <input type="text" id="course" placeholder="Course name">
            <input type="number" id="marks" placeholder="Marks (0-100)" min="0" max="100">
            <button id="addBtn">Add Course</button>
        </div>

        <h2>My Courses</h2>

        <table>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Marks</th>
                    <th>Grade</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="courseTable"></tbody>
        </table>

        <div class="summary">
            <p><strong>Total Courses:</strong> <span id="totalCourses">0</span></p>
            <p><strong>Average Score:</strong> <span id="averageScore">0</span></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
